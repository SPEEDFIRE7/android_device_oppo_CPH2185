name: Build LineageOS 17.1 ROM (CPH2185)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Device + vendor repo (owner/name)"
        required: true
        default: "SPEEDFIRE7/android_device_oppo_CPH2185"
        type: string
      device_branch:
        description: "Device tree branch"
        required: true
        default: "lineage-17.1"
        type: string
      vendor_branch:
        description: "Vendor blobs branch"
        required: true
        default: "vendor-lineage-17.1"
        type: string
      lineage_branch:
        description: "LineageOS manifest branch"
        required: true
        default: "lineage-17.1"
        type: string

jobs:
  build-rom:
    runs-on: namespace-profile-speed
    timeout-minutes: 360

    env:
      WORK: ${{ github.workspace }}/lineage
      OUT_DIR: ${{ github.workspace }}/out-artifacts

    steps:
      - name: Show disk space
        run: df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick libncurses-dev \
            libreadline-dev lib32z1-dev liblz4-tool libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk python3 unzip

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Init LineageOS manifest
        run: |
          mkdir -p "$WORK" && cd "$WORK"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install
          repo init -u https://github.com/LineageOS/android.git -b "${{ inputs.lineage_branch }}" --git-lfs --depth=1

      - name: Add device and vendor trees
        run: |
          cd "$WORK"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/oppo_CPH2185.xml <<EOF
          <manifest>
            <remote name="speedfire" fetch="https://github.com/" />
            <project name="${{ inputs.repo }}" path="device/oppo/CPH2185" remote="speedfire" revision="${{ inputs.device_branch }}" />
            <project name="${{ inputs.repo }}" path="vendor/oppo/CPH2185" remote="speedfire" revision="${{ inputs.vendor_branch }}" />
          </manifest>
          EOF

      - name: Sync sources
        run: |
          cd "$WORK"
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Verify trees
        run: |
          cd "$WORK"
          test -f device/oppo/CPH2185/BoardConfig.mk || { echo "BoardConfig.mk missing"; exit 1; }
          test -f device/oppo/CPH2185/lineage_CPH2185.mk || { echo "lineage_CPH2185.mk missing"; exit 1; }
          test -d vendor/oppo/CPH2185/proprietary || { echo "vendor blobs missing"; exit 1; }

      - name: Build ROM
        env:
          USE_CCACHE: 1
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          cd "$WORK"
          ccache -M 100G || true
          source build/envsetup.sh
          lunch lineage_CPH2185-userdebug
          mka bacon -j$(nproc)

      - name: Collect output
        run: |
          cd "$WORK"
          mkdir -p "$OUT_DIR"
          ZIP=$(ls out/target/product/CPH2185/lineage-17.1-*-UNOFFICIAL-CPH2185.zip 2>/dev/null | head -n1)
          test -n "$ZIP" || { echo "ROM zip not produced"; exit 1; }
          cp "$ZIP" "$OUT_DIR/"
          cp out/target/product/CPH2185/recovery.img "$OUT_DIR/" 2>/dev/null || true
          sha256sum "$OUT_DIR"/* > "$OUT_DIR/SHA256SUMS"

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineage-17.1-cph2185
          path: ${{ env.OUT_DIR }}
          retention-days: 7
