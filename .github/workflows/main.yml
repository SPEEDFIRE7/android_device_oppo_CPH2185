name: Build LineageOS 17.1 ROM (CPH2185)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Namespace runner profile"
        required: true
        default: "namespace-profile-speed"
        type: string
      repo:
        description: "Device + vendor repo (owner/name)"
        required: true
        default: "SPEEDFIRE7/android_device_oppo_CPH2185"
        type: string
      device_branch:
        description: "Device tree branch"
        required: true
        default: "lineage-17.1"
        type: string
      vendor_branch:
        description: "Vendor blobs branch"
        required: true
        default: "vendor-lineage-17.1"
        type: string
      lineage_branch:
        description: "LineageOS manifest branch"
        required: true
        default: "lineage-17.1"
        type: string
      build_variant:
        description: "Build variant"
        required: true
        default: "userdebug"
        type: choice
        options:
          - userdebug
          - user
          - eng

defaults:
  run:
    shell: bash

jobs:
  build-rom:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    env:
      WORK: \${{ github.workspace }}/lineage
      OUT_DIR: \${{ github.workspace }}/out-artifacts
      CCACHE_DIR: \${{ github.workspace }}/.ccache

    steps:
      - name: Show disk space
        run: |
          df -h
          nproc
          free -h
          lsb_release -a || true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick libncurses-dev \
            libreadline-dev lib32z1-dev liblz4-tool libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 unzip

      - name: Install libncurses5 / libtinfo5 (needed by Android 10 prebuilts)
        run: |
          if ! sudo apt-get install -y libncurses5 libtinfo5; then
            echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee /etc/apt/sources.list.d/jammy-ncurses.list
            sudo apt-get update
            sudo apt-get install -y libncurses5 libtinfo5
            sudo rm -f /etc/apt/sources.list.d/jammy-ncurses.list
            sudo apt-get update
          fi

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Init LineageOS manifest
        run: |
          mkdir -p "$WORK" && cd "$WORK"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global color.ui false
          git lfs install
          repo init -u https://github.com/LineageOS/android.git -b "\${{ inputs.lineage_branch }}" --git-lfs --depth=1

      - name: Add device and vendor trees
        run: |
          cd "$WORK"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/oppo_CPH2185.xml <<EOF
          <manifest>
            <remote name="speedfire" fetch="https://github.com/" />
            <project name="\${{ inputs.repo }}" path="device/oppo/CPH2185" remote="speedfire" revision="\${{ inputs.device_branch }}" />
            <project name="\${{ inputs.repo }}" path="vendor/oppo/CPH2185" remote="speedfire" revision="\${{ inputs.vendor_branch }}" />
          </manifest>
          EOF

      - name: Sync sources
        run: |
          cd "$WORK"
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      - name: Verify trees
        run: |
          cd "$WORK"
          test -f device/oppo/CPH2185/BoardConfig.mk || { echo "BoardConfig.mk missing"; exit 1; }
          test -f device/oppo/CPH2185/lineage_CPH2185.mk || { echo "lineage_CPH2185.mk missing"; exit 1; }
          test -d vendor/oppo/CPH2185/proprietary || { echo "vendor blobs missing"; exit 1; }
          test -f device/oppo/CPH2185/prebuilts/kernel || { echo "prebuilt kernel missing"; exit 1; }
          # Android 10 has no health 2.1 / fastboot 1.1 HAL
          if grep -Eq "health@2\.1|fastboot@1\.1" device/oppo/CPH2185/device.mk; then
            echo "device.mk uses Android 11+ HALs (health@2.1 / fastboot@1.1), not valid on Android 10"
            exit 1
          fi

      - name: Build ROM
        run: |
          cd "$WORK"
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"
          export BUILD_USERNAME=speedfire
          export BUILD_HOSTNAME=github-actions
          ccache -M 50G || true
          source build/envsetup.sh
          lunch lineage_CPH2185-\${{ inputs.build_variant }} || exit 1
          mka bacon -j"$(nproc --all)" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect output
        run: |
          cd "$WORK"
          mkdir -p "$OUT_DIR"
          ZIP=$(ls out/target/product/CPH2185/lineage-17.1-*-UNOFFICIAL-CPH2185.zip 2>/dev/null | head -n1)
          test -n "$ZIP" || { echo "ROM zip not produced"; exit 1; }
          cp "$ZIP" "$OUT_DIR/"
          cp out/target/product/CPH2185/boot.img "$OUT_DIR/" 2>/dev/null || true
          cp out/target/product/CPH2185/recovery.img "$OUT_DIR/" 2>/dev/null || true
          cd "$OUT_DIR" && sha256sum * > SHA256SUMS

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineage-17.1-cph2185
          path: \${{ env.OUT_DIR }}
          retention-days: 7

      - name: Collect logs on failure
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs"
          cp "$GITHUB_WORKSPACE/build.log" "$GITHUB_WORKSPACE/logs/" 2>/dev/null || true
          cp "$WORK/out/error.log" "$GITHUB_WORKSPACE/logs/" 2>/dev/null || true
          cp "$WORK/out/verbose.log.gz" "$GITHUB_WORKSPACE/logs/" 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: \${{ github.workspace }}/logs
          if-no-files-found: ignore
          retention-days: 7
